<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Awesome AI Literature Review Agents and Tools">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#141B33"/>
      <stop offset="1" stop-color="#1B2247"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C93FF"/>
      <stop offset="1" stop-color="#5EE6C9"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C93FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#5EE6C9" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="20" fill="url(#bg)"/>

  <!-- faint dotted grid -->
  <g fill="#5EE6C9" opacity="0.06">
    <circle cx="80"  cy="60"  r="2"/><circle cx="160" cy="60" r="2"/><circle cx="240" cy="60" r="2"/>
    <circle cx="1120" cy="300" r="2"/><circle cx="1200" cy="300" r="2"/><circle cx="1040" cy="300" r="2"/>
    <circle cx="1180" cy="70" r="2"/><circle cx="1100" cy="70" r="2"/><circle cx="1020" cy="70" r="2"/>
    <circle cx="120" cy="300" r="2"/><circle cx="200" cy="300" r="2"/>
  </g>

  <!-- decorative citation graph on the right -->
  <g stroke="url(#accent)" stroke-width="2" opacity="0.55" filter="url(#glow)">
    <line x1="1010" y1="120" x2="1110" y2="80"/>
    <line x1="1010" y1="120" x2="1120" y2="180"/>
    <line x1="1010" y1="120" x2="1000" y2="240"/>
    <line x1="1110" y1="80"  x2="1190" y2="140"/>
    <line x1="1120" y1="180" x2="1190" y2="140"/>
    <line x1="1120" y1="180" x2="1000" y2="240"/>
  </g>
  <g fill="#0B1020" stroke="url(#accent)" stroke-width="2.5">
    <circle cx="1010" cy="120" r="16" fill="url(#accent)"/>
    <circle cx="1110" cy="80"  r="11"/>
    <circle cx="1120" cy="180" r="13"/>
    <circle cx="1000" cy="240" r="10"/>
    <circle cx="1190" cy="140" r="9"/>
  </g>

  <!-- badge pill -->
  <rect x="72" y="60" width="196" height="34" rx="17" fill="url(#pill)" stroke="#7C93FF" stroke-opacity="0.4"/>
  <text x="90" y="83" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#9FB0FF" letter-spacing="1">AWESOME · CC0 · 70+ TOOLS</text>

  <!-- title -->
  <text x="72" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#F4F7FF">AI Literature Review</text>
  <text x="72" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="url(#accent)">Agents &amp; Tools</text>

  <!-- subtitle -->
  <text x="74" y="292" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#AEB8D6">search → read → extract → synthesize → verify citations</text>
  <text x="74" y="322" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#6B7699">The strongest curated map of open-source AI tools for literature review · 面向智能体文献综述的最强工具大全</text>
</svg>
