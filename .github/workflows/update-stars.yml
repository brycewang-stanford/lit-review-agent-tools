name: Update Star Counts

on:
  schedule:
    # 每周一 04:00 UTC 刷新 Star 数 / weekly refresh of star counts
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh star counts from the GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_stars.py

      - name: Commit changes if any
        run: |
          if [[ -n "$(git status --porcelain README.md README.en.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md README.en.md
            git commit -m "chore: auto-refresh star counts [skip ci]"
            git push
          else
            echo "No star-count changes."
          fi
