name: Lint & Link Check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每周一 03:00 UTC 跑一次，抓失效链接 / weekly, catch dead links
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  awesome-lint:
    name: awesome-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run awesome-lint
        run: npx awesome-lint || true

  link-check:
    name: markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links in README.md
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          use-verbose-mode: "yes"
          config-file: ".github/mlc-config.json"
          file-path: "./README.md, ./README.en.md"
