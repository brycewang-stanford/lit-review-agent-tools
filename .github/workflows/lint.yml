name: Lint & Link Check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每周一 03:00 UTC 跑一次，抓失效链接 / weekly, catch dead links
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  generated-files:
    name: data validation & drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # data/tools.yaml is the single source of truth; every Markdown surface is
      # rendered from it. If a PR edits the generated regions by hand, or edits
      # the data without rebuilding, this job fails.
      - name: Validate data files
        run: python3 scripts/validate.py
      - name: Check generated files are in sync
        run: python3 scripts/build.py --check

  awesome-lint:
    name: awesome-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # AWESOME.md is the awesome.re-compliant bullet edition and must pass
      # cleanly. The main README.md uses a richer table layout by design.
      - name: Run awesome-lint on AWESOME.md
        run: npx awesome-lint AWESOME.md

  link-check:
    name: markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links in README.md
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          use-verbose-mode: "yes"
          config-file: ".github/mlc-config.json"
          file-path: "./README.md, ./README.en.md"
